# fly deploy --config deploy/fly/gateway.toml --dockerfile Dockerfile   (from the repository root)
app = "autodev-gateway"      # change to your app name
primary_region = "iad"

[build]
  build-target = "gateway"

[env]
  AUTODEV_SERVICE = "gateway"
  PORT = "4100"

# Builders keep a WebSocket open, so machines must not stop while idle.
[http_service]
  internal_port = 4100
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
