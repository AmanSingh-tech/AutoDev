apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autodev.fullname" . }}-worker
  labels: {{- include "autodev.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "autodev.selector" (dict "root" . "component" "worker") | nindent 6 }}
  {{- if .Values.worker.embeddingsCache.persistence }}
  # One pod owns the cache volume (ReadWriteOnce), so replace pods instead of overlapping them.
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      labels: {{- include "autodev.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.env | sha256sum }}
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
    spec:
      {{- include "autodev.podCommon" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "autodev.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- include "autodev.envFrom" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: embeddings
              mountPath: /var/cache/autodev/embeddings
      volumes:
        - name: embeddings
          {{- if .Values.worker.embeddingsCache.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "autodev.fullname" . }}-embeddings
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.worker.embeddingsCache.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "autodev.fullname" . }}-embeddings
  labels: {{- include "autodev.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.worker.embeddingsCache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.worker.embeddingsCache.size }}
{{- end }}
