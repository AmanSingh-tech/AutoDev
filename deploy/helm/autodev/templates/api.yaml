apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autodev.fullname" . }}-api
  labels: {{- include "autodev.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "autodev.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "autodev.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Settings changes restart the pods.
        checksum/config: {{ toJson .Values.env | sha256sum }}
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
    spec:
      {{- include "autodev.podCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "autodev.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          {{- include "autodev.envFrom" . | nindent 10 }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autodev.fullname" . }}-api
  labels: {{- include "autodev.labels" . | nindent 4 }}
spec:
  selector: {{- include "autodev.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
{{- if .Values.api.ingress.enabled }}
---
{{ include "autodev.ingress" (dict "root" . "component" "api" "cfg" .Values.api.ingress "port" .Values.api.port) }}
{{- end }}
